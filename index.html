<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>我的笔记本 - 小红书存档</title>
<script src="data.js"></script>
<style>
:root{--sw:196px;--red:#ff2442;--bg:#fafafa;--card:#fff;--t1:#1a1a1a;--t2:#555;--t3:#999;--bd:#f0f0f0}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--card:#2a2a2a;--t1:#eee;--t2:#bbb;--t3:#888;--bd:#333}}
body.dark{--bg:#1a1a1a;--card:#2a2a2a;--t1:#eee;--t2:#bbb;--t3:#888;--bd:#333}
body.dark .d-desc{color:#bbb}body.dark .d-interact button:hover{background:#333}body.dark .overlay-modal{background:#2a2a2a}body.dark .sug-item:hover{background:rgba(255,255,255,.05)}body.dark .s-item:hover{background:rgba(255,255,255,.05)}body.dark .profile-stat-num{color:#fff}body.dark .profile-stat-label{color:#999}body.dark .profile-xhs-id{color:#888}body.dark .profile-xhs-id span{color:#ccc}body.dark .profile-xhs-id .sep{color:#555!important}body.dark .profile-xhs-id .ip-val{color:#ccc}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;min-height:100vh}

/* ═══ SIDEBAR ═══ */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sw);background:var(--bg);z-index:100;display:flex;flex-direction:column;padding:0 16px}
.s-logo{display:flex;align-items:center;padding:16px 0 14px 12px}
.s-nav{display:flex;flex-direction:column;gap:12px;flex:1}
.s-item{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:10px;font-size:15px;color:var(--t2);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background .12s;text-decoration:none}
.s-item:hover{background:rgba(0,0,0,.04);color:var(--t1)}
.s-item svg{width:20px;height:20px;flex-shrink:0;color:currentColor;stroke-width:2}
.s-item.active{background:rgba(255,36,66,.06);color:var(--red);font-weight:600}
.s-item.active svg{stroke-width:2}
.s-item-icon{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;flex-shrink:0}
.s-item-icon svg{width:20px;height:20px;stroke-width:2}
.s-bottom{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid var(--bd);margin-bottom:8px}
.s-lang{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:12px;color:var(--t3);cursor:pointer;border:none;background:none;width:100%;border-radius:8px;transition:background .12s}
.s-lang:hover{background:rgba(0,0,0,.04)}
.s-lang .sw{width:34px;height:20px;border-radius:10px;background:#ddd;position:relative;transition:background .2s;flex-shrink:0}
.s-lang .sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.s-lang.on .sw{background:var(--red)}
.s-lang.on .sw::after{transform:translateX(14px)}
.s-badge{font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:1px 6px;margin-left:auto;min-width:18px;text-align:center}

/* ═══ MAIN ═══ */
.main{margin-left:var(--sw);min-height:100vh}
@media(max-width:480px){.feed{grid-template-columns:repeat(2,1fr);gap:6px}}
@media(max-width:768px){#searchArea{width:calc(100vw - 32px)!important}
  .sidebar{display:none}.main{margin-left:0}.b2t{bottom:100px!important;right:14px!important;width:40px!important;height:40px!important;font-size:18px!important;z-index:1001!important}}

/* ═══ BANNER ═══ */
.banner{background:var(--card);padding:60px 0 0;text-align:center}
.banner-body{display:inline-flex;align-items:flex-start;gap:32px;text-align:left;padding-bottom:32px}
.avatar{flex-shrink:0;width:112px;height:112px;border-radius:50%;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-text{flex:1;min-width:0;padding-top:4px}
.profile-name-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.profile-name{font-size:22px;font-weight:700;letter-spacing:-.3px}
.profile-xhs-id{font-size:13px;color:var(--t3);margin-bottom:10px}
.profile-xhs-id span{color:var(--t2)}
.profile-bio{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:12px}
.profile-stats{display:flex;gap:36px;padding-bottom:8px}
.profile-stat{display:flex;align-items:baseline;gap:4px;border:none;background:none;padding:0;cursor:pointer}
.profile-stat-num{font-size:18px;font-weight:700}
.profile-stat-label{font-size:13px;color:var(--t3)}
.profile-btns{display:flex;gap:8px}
.btn{height:36px;padding:0 20px;border-radius:18px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:var(--card);color:var(--t1);border:1px solid #ddd}

/* ═══ TABS ═══ */
.tabs{background:var(--card);text-align:center}
.tabs-inner{display:inline-flex;gap:36px}
.tab{padding:16px 0;font-size:15px;color:var(--t3);cursor:pointer;border:none;background:none;position:relative;font-weight:500}
.tab:hover{color:var(--t2)}
.tab.active{color:var(--t1);font-weight:700}
.tab.active::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:28px;height:3px;background:var(--t1);border-radius:2px}
.tab-count{font-size:12px;color:var(--t3);margin-left:3px;font-weight:400}
.tab svg{vertical-align:-2px;margin-right:4px}

/* ═══ GRID ═══ */
.grid-area{padding:24px 0 60px;display:flex;justify-content:center;background:var(--card)}
.feed{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:1160px;margin:0 auto}
@media(max-width:1300px){.feed{grid-template-columns:repeat(4,220px)}}
@media(max-width:1000px){.feed{grid-template-columns:repeat(3,220px)}}
@media(max-width:700px){.feed{grid-template-columns:repeat(2,1fr)}}
.card{position:relative;cursor:pointer;background:var(--card);transition:transform .12s}
.card img{width:100%;display:block;object-fit:cover;background:#e8e8e8}
.card:hover{transform:translateY(-2px)}
.card-badges{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:8px;pointer-events:none;z-index:2}
.card-badge{font-size:11px;color:#fff;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.4);display:flex;align-items:center;gap:3px}
.card-badge.pin{background:var(--red)}
.card-badge svg{width:10px;height:10px}
.card-info{padding:8px 4px 4px;background:var(--card)}
.card-title{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--t1);font-weight:500;margin-bottom:6px}
.card-meta-row{display:flex;align-items:center;justify-content:space-between}
.card-author{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--t3)}
.card-av-mini{width:16px;height:16px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#eee}
.card-av-mini img{width:100%;height:100%;object-fit:cover}
.card-heart{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--t3)}

/* ═══ OVERLAY ═══ */
.overlay{position:fixed;inset:0;z-index:5000;display:none;background:rgba(0,0,0,.5)}
.overlay.open{display:block}
.overlay-wrap{position:absolute;inset:24px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.overlay-modal{display:flex;background:var(--card);border-radius:12px;overflow:hidden;max-width:1000px;max-height:calc(100vh - 48px);width:100%;pointer-events:auto;animation:fadeUp .25s ease;position:relative}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.overlay-close{position:absolute;top:10px;left:10px;z-index:20;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.35);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.overlay-close:hover{background:rgba(0,0,0,.5)}

.ol-image{flex:0 0 55%;background:var(--bg);display:flex;align-items:center;position:relative;min-height:400px;overflow:hidden}
.ol-image .d-track{display:flex;transition:transform .3s ease;width:100%;height:100%}
.ol-image .d-slide{min-width:100%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.ol-image .d-slide img{width:100%;max-height:calc(100vh - 48px);object-fit:contain;display:block;user-select:none}
.ol-image .d-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.ol-image .d-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.2s}
.ol-image .d-dot.active{background:#fff;width:18px;border-radius:3px}
.ol-image .d-arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;border:none;font-size:18px;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center;opacity:1;transition:.2s;line-height:1}
.ol-image .d-arrow:hover{background:rgba(0,0,0,.5)}
.ol-image .d-arrow.l{left:8px}
.ol-image .d-arrow.r{right:8px}
.ol-image .d-page{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.4);color:#fff;font-size:11px;padding:2px 8px;border-radius:8px;font-variant-numeric:tabular-nums}

.ol-content{flex:1;display:flex;flex-direction:column;overflow-y:auto;background:var(--card)}
.ol-scroll{padding:20px}
.ol-scroll::-webkit-scrollbar{width:4px}
.ol-scroll::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}

.d-user{display:flex;align-items:center;gap:10px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--bd)}
.d-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0}
.d-avatar img{width:100%;height:100%;object-fit:cover}
.d-user-text{flex:1;min-width:0}
.d-username{font-size:14px;font-weight:600}
.d-usersub{font-size:11px;color:var(--t3);margin-top:1px}
.d-title{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:8px}
.d-desc{font-size:14px;line-height:1.6;color:#333;white-space:pre-wrap;margin-bottom:10px;max-height:180px;overflow-y:auto}
.d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.d-tag{font-size:12px;color:#1e4876}
.d-tag::before{content:'#'}
.d-meta{font-size:12px;color:var(--t3);margin-bottom:14px}

.d-interact{display:flex;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);margin-bottom:12px}
.d-interact button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--t3);cursor:pointer;border:none;background:none;padding:10px 0;border-radius:6px}
.d-interact button:hover{background:#f8f8f8}
.d-interact svg{width:20px;height:20px;color:#444}
.d-interact .num{font-size:13px;font-weight:600;color:var(--t1)}

/* ═══ COMMENTS ═══ */
.d-cmts-t{font-size:14px;font-weight:600;margin-bottom:8px}
.c-item{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #f2f2f2}
.c-avatar{width:28px;height:28px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#eee}
.c-avatar img{width:100%;height:100%;object-fit:cover}
.c-body{flex:1;min-width:0}
.c-nickname{font-size:12px;font-weight:600;color:#333}
.c-text{font-size:13px;line-height:1.5;margin:2px 0 4px}
.c-meta{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:8px}
.c-sub{padding:8px 0 0 36px;display:flex;gap:6px}
.c-savatar{width:22px;height:22px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#eee}
.c-savatar img{width:100%;height:100%;object-fit:cover}
.c-sbody{flex:1}
.c-stext{font-size:12px;line-height:1.4;margin:2px 0 4px}
.c-smeta{font-size:11px;color:var(--t3);display:flex;gap:8px}

/* ═══ MOBILE ═══ */
@media(max-width:480px){.feed{grid-template-columns:repeat(2,1fr);gap:6px}}
@media(max-width:768px){#searchArea{width:calc(100vw - 32px)!important}
  .banner{padding:32px 16px 0}
  .banner-body{gap:16px}
  .avatar{width:72px;height:72px}
  .profile-name{font-size:20px}
  .profile-xhs-id{font-size:12px}
  .profile-bio{font-size:14px;margin-bottom:12px!important}
  .profile-text{min-width:0}
  .profile-stats{gap:24px}
  .profile-stat-num{font-size:18px}
  .profile-stat-label{font-size:12px}
  .feed{grid-template-columns:1fr 1fr;gap:6px}
  .grid-area{padding:12px 16px 80px}
  body{padding-bottom:56px}
  .overlay-wrap{inset:0}
  .overlay-modal{flex-direction:column;border-radius:0;max-height:100vh}
  .ol-image{flex:0 0 auto;width:100%;min-height:300px;max-height:45vh}
  .mnav{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:var(--card);border-top:1px solid var(--bd);height:56px;display:flex!important;padding-bottom:env(safe-area-inset-bottom,0)}
}
@media(min-width:769px){.mnav{display:none!important}}
.mnav{display:flex}
.mnav-icon{display:inline-flex;width:22px;height:22px;align-items:center;justify-content:center}
.mnav-icon svg{width:20px;height:20px}
.mnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--t3);cursor:pointer;border:none;background:none}

/* back to top */
.b2t{position:fixed;bottom:32px;right:32px;width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:0 2px 12px rgba(0,0,0,.12);border:1px solid var(--bd);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:1001;opacity:0;transform:translateY(12px);pointer-events:none;transition:all .3s;color:var(--t2)}
.b2t.vis{opacity:1;transform:translateY(0);pointer-events:auto}
.b2t:hover{box-shadow:0 4px 16px rgba(0,0,0,.15)}

/* toast */
.toast{position:fixed;z-index:9999;background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;pointer-events:none;opacity:0;transform:translateY(8px);transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateY(0)}

/* share panel */
.share-mask{position:fixed;inset:0;z-index:6000;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.share-mask.open{display:flex}
.share-panel{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:500px;padding:24px 20px 32px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.share-title{text-align:center;font-size:16px;font-weight:600;margin-bottom:20px}
.share-icons{display:flex;justify-content:space-around;margin-bottom:16px}
.share-icon{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:none;background:none;padding:8px;border-radius:12px;transition:background .15s}
.share-icon:hover{background:#f5f5f5}
.share-icon .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px}
.share-icon .lb{font-size:11px;color:var(--t2)}
.share-cancel{width:100%;height:44px;border-radius:22px;border:1px solid #ddd;background:var(--card);font-size:15px;cursor:pointer;margin-top:8px}
.share-cancel:hover{background:#f5f5f5}
</style>
</head>
<body>

<!-- ═══ SIDEBAR ═══ -->
<aside class="sidebar">
  <div class="s-logo">
    <svg width="120" height="38" viewBox="0 0 120 38"><rect width="120" height="38" rx="8" fill="#ff2442"/><text x="60" y="24" text-anchor="middle" fill="#fff" font-size="17" font-weight="800" letter-spacing="4" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" id="logoText" data-lang="logo_text">笔记本</text></svg>
  </div>
  <div class="s-nav">
    <button class="s-item active"><span class="s-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span data-lang="home">首页</span></button>
    <a class="s-item" href="#"><span class="s-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span data-lang="me">我</span></a>
    <div id="sidebarLinks"></div>
  </div>
  <div class="s-bottom">
    <a class="s-item" href="https://github.com/hugcosmos/SaveMyRedNote" target="_blank" style="font-size:12px;color:var(--t3);text-decoration:none"><span data-lang="about">拯救我的红书</span></a>
    <button class="s-lang" id="langToggle"><span class="sw"></span>EN</button>
    <button class="s-lang" id="darkToggle"><span class="sw"></span><span data-lang="dark">🌙 深色</span></button>
  </div>
</aside>

<!-- ═══ MAIN ═══ -->
<div class="main">

  <!-- SEARCH BAR -->
  <div style="padding:8px 0;text-align:center;background:var(--card);position:sticky;top:0;z-index:100">
    <div id="searchArea" style="display:inline-block;position:relative;width:440px">
      <div style="position:relative">
        <input id="searchBox" type="text" placeholder="" style="width:100%;height:40px;border-radius:999px;border:none;background:rgba(0,0,0,0.03);padding:0 80px 0 16px;font-size:14px;outline:none;color:var(--t1);caret-color:var(--red)" oninput="doSearch()" onkeydown="if(event.key==='Enter')doSearch()" onfocus="showSuggestions()">
        <span id="searchPlaceholder" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:14px;color:#bbb;pointer-events:none;transition:opacity .2s" onclick="document.getElementById('searchBox').focus()">搜索笔记...</span>
        <button id="searchClear" onclick="clearSearch(event)" style="display:none;position:absolute;right:44px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:none;background:#ccc;color:#fff;font-size:12px;cursor:pointer;line-height:1;text-align:center;padding:0">✕</button>
        <button onclick="doSearch()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:none;background:var(--red);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
      </div>
      <!-- Suggestions -->
      <div id="suggestions" style="display:none;background:var(--card);border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.08);padding:8px 0;margin-top:6px;text-align:left;overflow:hidden"></div>
    </div>
  </div>

  <style>
  .sug-item{padding:10px 16px;font-size:14px;cursor:pointer;transition:background .1s}
  .sug-item:hover{background:rgba(0,0,0,.03)}
  </style>

  <!-- BANNER -->
  <div class="banner">
    <div class="banner-body">
      <div class="avatar"><img src="" onerror="this.onerror=null;this.parentElement.innerHTML='<div style=width:96px;height:96px;border-radius:50%;background:#ff2442;display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px>🌿</div>'"></div>
      <div class="profile-text">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:4px">
          <div>
            <div class="profile-name-row"><span class="profile-name"></span></div>
            <div class="profile-xhs-id" style="margin-bottom:0"><span data-lang="xhs_id">小红书号</span>：<span></span> <span class="sep" style="color:#ddd">|</span> <span data-lang="ip_loc">IP属地</span>：<span class="ip-val"></span></div>
          </div>
          <a href="#" class="btn btn-red" style="flex-shrink:0" data-lang="follow">关注</a>
        </div>
        <div class="profile-bio" style="margin-top:6px"></div>
                <div class="profile-stats" style="margin-bottom:0">
          <button class="profile-stat"><span class="profile-stat-num" id="sFollow">-</span><span class="profile-stat-label" data-lang="follow">关注</span></button>
          <button class="profile-stat"><span class="profile-stat-num" id="sFans">-</span><span class="profile-stat-label" data-lang="fans">粉丝</span></button>
          <button class="profile-stat"><span class="profile-stat-num" id="sLikes">-</span><span class="profile-stat-label" data-lang="likes">获赞与收藏</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tabs-inner">

};

function stripHash(s){return(s||'').replace(/#\S+/g,'').replace(/\n\s*\n\s*$/,'').trim()}

// ═══ CONFIG ═══
const DEFAULTS={placeholderZh:'搜索笔记...',placeholderEn:'Search notes...',suggestions:[],apiKey:'',authorName:'',authorAvatar:'',authorBio:'',authorRedId:'',authorIp:'',authorUserId:'',followCount:'-',fansCount:'-',sidebarLinks:[
  {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>',nameZh:'微信',nameEn:'WeChat',url:''},
  {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M4 4h16v16H4z"/><line x1="4" y1="9" x2="20" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>',nameZh:'头条',nameEn:'Toutiao',url:''},
  {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><polygon points="5 3 19 12 5 21 5 3"/></svg>',nameZh:'B站',nameEn:'Bilibili',url:''},
  {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',nameZh:'视频号',nameEn:'Video',url:''},
  {icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:20px;height:20px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>',nameZh:'邮箱',nameEn:'Email',url:''}
]};
const CITY_EN={北京:'Beijing',上海:'Shanghai',广州:'Guangzhou',深圳:'Shenzhen',杭州:'Hangzhou',成都:'Chengdu',武汉:'Wuhan',西安:"Xi'an",南京:'Nanjing',重庆:'Chongqing',天津:'Tianjin',苏州:'Suzhou',长沙:'Changsha',郑州:'Zhengzhou',东莞:'Dongguan',青岛:'Qingdao',沈阳:'Shenyang',宁波:'Ningbo',昆明:'Kunming',大连:'Dalian',厦门:'Xiamen',合肥:'Hefei',佛山:'Foshan',福州:'Fuzhou',哈尔滨:'Harbin',济南:'Jinan',温州:'Wenzhou',长春:'Changchun',石家庄:'Shijiazhuang',常州:'Changzhou',泉州:'Quanzhou',南宁:'Nanning',贵阳:'Guiyang',南昌:'Nanchang',太原:'Taiyuan',烟台:'Yantai',嘉兴:'Jiaxing',南通:'Nantong',金华:'Jinhua',珠海:'Zhuhai',惠州:'Huizhou',徐州:'Xuzhou',海口:'Haikou',乌鲁木齐:'Urumqi',绍兴:'Shaoxing',中山:'Zhongshan',台州:'Taizhou',兰州:'Lanzhou',俄罗斯:'Russia',香港:'Hong Kong',澳门:'Macau'};
var cfg=getConfig();
function loadConfig(){try{var c=JSON.parse(localStorage.getItem('xhs_config')||'{}');if(c.sidebarLinks)c.sidebarLinks=c.sidebarLinks.map(function(l){if(typeof l.icon==='string'&&l.icon.indexOf('<svg')!==0)l.icon='';return l;});return c}catch(e){return{}}}
function getConfig(){return Object.assign({},DEFAULTS,loadConfig())}
var __XHS_CFG__=window.__XHS_CONFIG__||{};if(__XHS_CFG__.authorName)Object.assign(DEFAULTS,__XHS_CFG__)
// Load config.json as base (optional — created by xhs_collect.py)
fetch('config.json?_t='+Date.now()).then(function(r){if(r.ok)return r.json()}).then(function(fc){if(fc){Object.assign(DEFAULTS,fc);cfg=getConfig();applyConfig();if(typeof renderGrid==='function')renderGrid()}}).catch(function(){})
function applyConfig(c){
  c=c||getConfig();
  var ph=lang==='en'?(c.placeholderEn||DEFAULTS.placeholderEn):(c.placeholderZh||DEFAULTS.placeholderZh);
  var phEl=document.getElementById('searchPlaceholder');if(phEl)phEl.textContent=ph;
  var sugEl=document.getElementById('suggestions');
  if(sugEl)sugEl.innerHTML=(c.suggestions||DEFAULTS.suggestions).map(function(s){return'<div class=\"sug-item\" onclick=\"pickSuggestion(\''+s+'\')\">'+s+'</div>'}).join('');
  // Update profile info
  document.querySelectorAll('.banner .avatar img, .d-avatar img').forEach(function(el){el.src=c.authorAvatar});
  document.querySelectorAll('.profile-name, .d-username').forEach(function(el){el.textContent=c.authorName});
  var bioEl=document.querySelector('.pbio,.profile-bio'); if(bioEl)bioEl.textContent=c.authorBio;
  document.title=c.authorName?c.authorName+' - 笔记本':'我的笔记本 - 小红书存档';
  if(document.getElementById('sFollow'))document.getElementById('sFollow').textContent=c.followCount||'-';
  if(document.getElementById('sFans'))document.getElementById('sFans').textContent=c.fansCount||'-';
  var pidSpan=document.querySelector('.profile-xhs-id'); if(pidSpan)pidSpan.innerHTML='<span data-lang="xhs_id">'+t('xhs_id')+'</span>：<span>'+c.authorRedId+'</span> <span class="sep" style="color:#ddd">|</span> <span data-lang="ip_loc">'+t('ip_loc')+'</span>：<span class="ip-val">'+city(c.authorIp)+'</span>';
  // Render sidebar links from config
  var links=(c.sidebarLinks||DEFAULTS.sidebarLinks),container=document.getElementById('sidebarLinks');
  if(container) container.innerHTML=links.map(function(l){var ic=l.icon||'';if(ic.indexOf('<svg')===0)ic='<span class="s-item-icon">'+ic+'</span>';else ic='<span class="s-item-icon" style="font-size:18px">'+ic+'</span>';return'<a class="s-item" href="'+(l.url||'javascript:')+'" target="_blank">'+ic+'<span>'+(lang==='en'?(l.nameEn||l.nameZh):l.nameZh)+'</span></a>';}).join('');
}

function t(key){return (T[key]||{})[lang]||T[key]?.zh||key;}
function city(cn){return lang==='zh'?cn:(CITY_EN[cn]||cn);}
function showSuggestions(){
  document.getElementById('suggestions').style.display='block';
}
function pickSuggestion(s){
  document.getElementById('searchBox').value=s;
  document.getElementById('searchPlaceholder').style.opacity='0';
  document.getElementById('searchClear').style.display='block';
  document.getElementById('suggestions').style.display='none';
  doSearch();
}
function clearSearch(e){
  if(e)e.stopPropagation();
  var sb=document.getElementById('searchBox');
  sb.value='';
  document.getElementById('searchPlaceholder').style.opacity='1';
  document.getElementById('searchClear').style.display='none';
  // Show all cards
  document.querySelectorAll('.card').forEach(function(c){c.style.display=''});
  sb.focus();
}
function doSearch(){
  var q=document.getElementById('searchBox').value.toLowerCase().trim();
  // If empty, use the default placeholder word
  if(!q){
    var ph=document.getElementById('searchPlaceholder').textContent.trim();
    if(ph){document.getElementById('searchBox').value=ph;q=ph.toLowerCase()}
  }
  document.getElementById('searchPlaceholder').style.opacity=q?'0':'1';
  document.getElementById('searchClear').style.display=q?'block':'none';
  document.getElementById('suggestions').style.display='none';
  document.querySelectorAll('.card').forEach(function(c){
    var t=(c.querySelector('.card-title')?.textContent||c.dataset.title||'').toLowerCase();
    c.style.display=q&&!t.includes(q)?'none':'';
  });
}
function filterNotes(){doSearch()}
function applyLang(){
  document.querySelectorAll('[data-lang]').forEach(el=>{
    const k=el.dataset.lang;
    if(el.tagName==='INPUT'||el.tagName==='TEXTAREA') el.placeholder=t(k);
    else el.textContent=t(k);
  });
  document.getElementById('langToggle').classList.toggle('on',lang==='en');
  localStorage.setItem('lang',lang);
  applyConfig(); // re-apply config for placeholder in new language
  renderGrid();
  if(cur){
    // Re-render current note with translations
    const n=cur,rawTitle=n.title||'';
    const dTitleEl=document.getElementById('dTitle');
    const dDescEl=document.getElementById('dDesc');
    if(lang==='en'&&n._titleEn){
      dTitleEl.innerHTML=n._titleEn+'<div style=font-size:14px;color:var(--t3);font-weight:400;margin-top:4px>'+rawTitle+'</div>';
    }else{
      dTitleEl.textContent=rawTitle||'';
    }
    const cd=stripHash(n.description||'');
    const cde=n._descEn?stripHash(n._descEn):'';
    if(lang==='en'&&cde){
      dDescEl.innerHTML=cde+'<div style=margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);color:var(--t3);font-size:13px;line-height:1.5;white-space:pre-wrap>'+cd+'</div>';
    }else{
      dDescEl.textContent=cd;
    }
    renderComments(n);
  }
}

document.getElementById('langToggle').addEventListener('click',()=>{
  lang=lang==='zh'?'en':'zh';applyLang();
});
// Dark mode toggle
var dark=localStorage.getItem('xhs_dark')==='1';
function applyDark(){document.body.classList.toggle('dark',dark);document.getElementById('darkToggle').classList.toggle('on',dark);}
document.getElementById('darkToggle').addEventListener('click',()=>{dark=!dark;localStorage.setItem('xhs_dark',dark?'1':'0');applyDark();});
applyDark();
const rTime=t=>{if(!t)return'';const s=Math.floor((Date.now()-t)/1e3);if(s<60)return'刚刚';const m=Math.floor(s/60);if(m<60)return m+'分钟前';const h=Math.floor(m/60);if(h<24)return h+'小时前';const d=Math.floor(h/24);if(d<7)return d+'天前';const dt=new Date(t);return dt.getFullYear()+'-'+(dt.getMonth()+1).toString().padStart(2,'0')+'-'+dt.getDate().toString().padStart(2,'0')};
const fTime=t=>{if(!t)return'';const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

(function init(){
  if(!notes.length){document.getElementById('grid').innerHTML='<div style=text-align:center;padding:80px;color:#999>📭 无数据</div>';return}
  // Populate UI from config (handled by applyConfig)

  const tl=notes.reduce((s,n)=>s+parseInt(n.interactInfo?.likeCount||0),0);
  document.getElementById('sLikes').textContent=tl;
  document.getElementById('sFollow').textContent=cfg.followCount||'-';
  document.getElementById('sFans').textContent=cfg.fansCount||'-';
  document.getElementById('tabCnt').textContent='·'+notes.length;
  applyConfig();
  applyLang();
  renderGrid();
  // Handle ?note=xxx for shared links
  const p=new URLSearchParams(location.search);
  const nid=p.get('note');
  if(nid){const idx=notes.findIndex(x=>x.noteId===nid);if(idx>=0)setTimeout(()=>openDetail(idx),500)}
  addEventListener('keydown',e=>{if(!document.getElementById('overlay').classList.contains('open'))return;if(e.key==='ArrowLeft')goPrev();else if(e.key==='ArrowRight')goNext();else if(e.key==='Escape')closeDetail()});
  const cw=document.getElementById('dCar');
  cw.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  cw.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40)dx>0?goPrev():goNext()});
  document.getElementById('overlay').addEventListener('click',e=>{if(e.target===document.getElementById('overlay'))closeDetail()});
  document.getElementById('btnClose').addEventListener('click',closeDetail);
  document.getElementById('dPrev').addEventListener('click',goPrev);
  document.getElementById('dNext').addEventListener('click',goNext);
  window.addEventListener('scroll',()=>{document.getElementById('b2t').classList.toggle('vis',scrollY>400)});
  document.getElementById('b2t').addEventListener('click',()=>{scrollTo({top:0,behavior:'smooth'})});
  // Mobile nav handlers
  document.getElementById('mDark').addEventListener('click',function(){dark=!dark;localStorage.setItem('xhs_dark',dark?'1':'0');applyDark()});
  document.getElementById('mLang').addEventListener('click',function(){lang=lang==='zh'?'en':'zh';applyLang();this.querySelector('span:last-child').textContent=lang==='en'?'中':'EN'});
  // Hide suggestions on outside click
  document.addEventListener('click',function(e){if(!document.getElementById('searchArea').contains(e.target))document.getElementById('suggestions').style.display='none'});
})();

function renderGrid(){
  document.getElementById('grid').innerHTML=notes.map((n,i)=>{
    const lc=n.interactInfo?.likeCount||'0',im=n.images?.length||0;
    const rawTitle=n.title||'';
    const title=(lang==='en'&&n._titleEn)?n._titleEn:rawTitle;
    return`<div class="card" data-i="${i}">
      <img src="${n._coverPath.replace('images/','images_wm/')}" loading="lazy" style="aspect-ratio:3/4" onerror="this.src='${n._coverPath.replace('images/','images_wm/').replace('.webp','.jpg')}';this.onerror=function(){this.style.background='#ddd'}">
      <div class="card-badges"><span>${n._sticky?'<span class="card-badge pin">'+t('pinned')+'</span>':''}${im>1?'<span class="card-badge">'+im+t('imgs')+'</span>':''}</span></div>
      <div class="card-info">
        ${title?`<div class="card-title">${title}</div>`:''}
        <div class="card-meta-row"><span class="card-author"><span class="card-av-mini"><img src="${cfg.authorAvatar}" onerror="this.style.display='none'"></span>${cfg.authorName}</span><span class="card-heart"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> ${lc}</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('grid').addEventListener('click',e=>{
    const card=e.target.closest('.card');if(card)openDetail(parseInt(card.dataset.i));
  });
}

function openDetail(i){
  const n=notes[i];cur=n;cs=0;
  // Reset like button for new note
  const lb=document.querySelector('.d-interact button[data-liked]');
  if(lb){lb.dataset.liked='0';const svg=lb.querySelector('svg');svg.innerHTML='<path d=\"M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z\"/>';svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor')}
  document.getElementById('overlay').classList.add('open');document.body.style.overflow='hidden';
  const dTitleEl=document.getElementById('dTitle');
  const dDescEl=document.getElementById('dDesc');
  const rawTitle=n.title||'';
  if(lang==='en'&&n._titleEn){
    dTitleEl.innerHTML=n._titleEn+'<div style=font-size:14px;color:var(--t3);font-weight:400;margin-top:4px>'+rawTitle+'</div>';
  }else{
    dTitleEl.textContent=rawTitle||'';
  }
  const cleanDesc=stripHash(n.description||'');
  const cleanDescEn=n._descEn?stripHash(n._descEn):'';
  if(lang==='en'&&cleanDescEn){
    dDescEl.innerHTML=cleanDescEn+'<div style=margin-top:12px;padding-top:12px;border-top:1px solid var(--bd);color:var(--t3);font-size:13px;line-height:1.5;white-space:pre-wrap>'+cleanDesc+'</div>';
  }else{
    dDescEl.textContent=cleanDesc;
  }
  document.getElementById('dTags').innerHTML=(n.tags||[]).map(t=>`<span class=d-tag>${t}</span>`).join('');
  var loc=city(n.ipLocation||cfg.authorIp);
  document.getElementById('dMeta').textContent=fTime(n.timestamp)+' · '+t('ip_loc')+'：'+loc;
  document.getElementById('dSub').textContent=rTime(n.timestamp)+' · '+t('ip_loc')+'：'+loc;
  const ir=n.interactInfo||{};
  document.getElementById('dL').textContent=ir.likeCount||'0';
  document.getElementById('dC').textContent=ir.collectCount||'0';
  // Show filtered comment count: author's own + author's replies in others' comments
  const myCmCount=(n.comments||[]).filter(c=>{
    if((c.userInfo||{}).userId===cfg.authorUserId) return true;
    return (c.subComments||[]).some(s=>(s.userInfo||{}).userId===cfg.authorUserId);
  }).length;
  document.getElementById('dCm').textContent=myCmCount;
  document.getElementById('dS').textContent=ir.shareCount||'0';
  const cnt=n.images?.length||0;
	  document.getElementById('dTrack').innerHTML=Array.from({length:cnt},(_,j)=>`<div class=d-slide><img src="images_wm/${n._imgDir}/${String(j+1).padStart(2,'0')}.webp" onerror="this.src='images_wm/${n._imgDir}/${String(j+1).padStart(2,'0')}.jpg'" style="cursor:zoom-in" onclick="zoomImage(event, ${j})"></div>`).join('');
	  document.getElementById('dDots').innerHTML=cnt>1?Array.from({length:cnt},(_,j)=>`<div class="d-dot${j===0?' active':''}" onclick="goSlide(${j})"></div>`).join(''):'';
	  document.getElementById('dPage').textContent=cnt>1?'1/'+cnt:'';
	  document.getElementById('dPrev').style.display=cnt>1?'flex':'none';
	  document.getElementById('dNext').style.display=cnt>1?'flex':'none';
  renderComments(n);
}

function renderComments(n){
  const cmts=n.comments||[],sec=document.getElementById('dCmts');
  // Keep author's own top-level comments, also keep others' comments if the author replied in subComments
  const myCmts=cmts.filter(c=>{
    if((c.userInfo||{}).userId===cfg.authorUserId) return true;
    return (c.subComments||[]).some(s=>(s.userInfo||{}).userId===cfg.authorUserId);
  });
  if(!myCmts.length){sec.style.display='none';return}
  sec.style.display='block';
  var cmtCount=myCmts.length+(myCmts.flatMap?myCmts.flatMap(c=>(c.subComments||[]).filter(s=>(s.userInfo||{}).userId===cfg.authorUserId)).length:0);
  sec.innerHTML='<div class=d-cmts-t>'+t('comments')+' · '+cmtCount+'</div>'
    +myCmts.map(c=>{
      const isMyCmt=(c.userInfo||{}).userId===cfg.authorUserId;
      const u=c.userInfo||{};
      const av=isMyCmt?cfg.authorAvatar:(u.image||'');
      const nick=isMyCmt?cfg.authorName:(lang==='en'&&u._nicknameEn?u._nicknameEn:(u.nickname||'?'));
      const ctextEn=lang==='en'&&c._contentEn?c._contentEn:null;
      const chtml=ctextEn?ctextEn+'<div style=color:var(--t3);font-size:12px;margin-top:4px>'+c.content+'</div>':c.content;
      // Filter sub-comments to author only
      const mySubs=(c.subComments||[]).filter(s=>(s.userInfo||{}).userId===cfg.authorUserId);
      return'<div class=c-item>'
        +'<div class=c-avatar>'+(av?'<img src="'+av+'" onerror="this.style.display=\'none\'">':'')+'</div>'
        +'<div class=c-body><div class=c-nickname>'+nick+(isMyCmt?' <span style="background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:middle">作者</span>':'')+'</div>'
        +'<div class=c-text>'+chtml+'</div>'
        +'<div class=c-meta><span>'+rTime(c.createTime)+'</span>'+(c.ipLocation?'<span>'+city(c.ipLocation)+'</span>':'')+(parseInt(c.likeCount)>0?'<span>❤️ '+c.likeCount+'</span>':'')+'</div>'
        +(mySubs.length?mySubs.map(s=>{
          const stextEn=lang==='en'&&s._contentEn?s._contentEn:null;
          const shtml=stextEn?stextEn+'<div style=color:var(--t3);font-size:11px;margin-top:2px>'+s.content+'</div>':s.content;
          return'<div class=c-sub><div class=c-savatar>'+(cfg.authorAvatar?'<img src="'+cfg.authorAvatar+'" onerror="this.style.display=\'none\'">':'')+'</div>'
            +'<div class=c-sbody><div class=c-nickname>'+cfg.authorName+' <span style="background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:4px;vertical-align:middle">作者</span></div>'
            +'<div class=c-stext>'+shtml+'</div>'
            +'<div class=c-smeta><span>'+rTime(s.createTime)+'</span>'+(s.ipLocation?'<span>'+city(s.ipLocation)+'</span>':'')+(parseInt(s.likeCount)>0?'<span>❤️ '+s.likeCount+'</span>':'')+'</div></div></div>';
        }).join(''):'')
        +'</div></div>';
    }).join('');
}

function closeDetail(){document.getElementById('overlay').classList.remove('open');document.body.style.overflow='';setTimeout(()=>{cur=null},300)}

function showMsg(m){
  const el=document.createElement('div');
  el.textContent=m;
  el.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:rgba(0,0,0,.78);color:#fff;padding:12px 28px;border-radius:24px;font-size:14px;pointer-events:none;white-space:nowrap';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el.remove(),400)},1500);
}
function shareNote(){
  if(!cur)return;
  const url=location.origin+location.pathname+'?note='+cur.noteId;
  navigator.clipboard.writeText(url).then(()=>showMsg('复制成功，快去分享吧！'));
}
function bookmarkNote(){shareNote();}
function commentNote(){document.getElementById('dCmts').scrollIntoView({behavior:'smooth'})}
function likeNote(e){
  const btn=e.currentTarget;
  if(btn.dataset.liked==='1')return;
  btn.dataset.liked='1';
  const svg=btn.querySelector('svg');
  const numEl=btn.querySelector('.num');
  svg.innerHTML='<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>';
  svg.setAttribute('fill','#ff2442');svg.setAttribute('stroke','#ff2442');
  numEl.textContent=(parseInt(numEl.textContent)||0)+1;
}

function upCar(){document.getElementById('dTrack').style.transform='translateX(-'+cs*100+'%)';document.querySelectorAll('.d-dot').forEach((d,j)=>d.classList.toggle('active',j===cs));document.getElementById('dPage').textContent=(cs+1)+'/'+Math.max(cur?.images?.length||1,1)}
function zoomImage(e,idx){const src=e.target.src;var allImgs=[];if(cur&&cur.images)allImgs=cur.images.map(function(_,j){return'images_wm/'+cur._imgDir+'/'+String(j+1).padStart(2,'0')+'.webp'});var curIdx=idx||cs;let lb=document.getElementById('lightbox');if(lb){lb.remove();return}
lb=document.createElement('div');lb.id='lightbox';lb.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none';
lb.addEventListener('click',function(ev){if(ev.target===lb)lb.remove()});

// Top bar
var tb=document.createElement('div');tb.style.cssText='position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;z-index:2';
var closeBtn=document.createElement('button');closeBtn.innerHTML='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
closeBtn.style.cssText='background:rgba(0,0,0,.35);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0';
closeBtn.onclick=function(ev){ev.stopPropagation();lb.remove()};
tb.appendChild(closeBtn);
var counter=document.createElement('span');counter.id='lbCounter';counter.textContent=allImgs.length>1?(curIdx+1)+'/'+allImgs.length:'';
counter.style.cssText='color:#fff;font-size:14px;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:12px';
tb.appendChild(counter);
var spacer=document.createElement('span');spacer.style.width='36px';tb.appendChild(spacer);
lb.appendChild(tb);

// Image
var img=document.createElement('img');img.id='lbImg';img.src=src;img.style.cssText='max-width:90vw;max-height:75vh;object-fit:contain;transition:transform .2s;transform:scale(1) rotate(0deg)';img.draggable=false;
img.zoomLevel=1;img.rotation=0;
lb.appendChild(img);

// Prev/Next arrows for multi-image
if(allImgs.length>1){
var prevBtn=document.createElement('button');prevBtn.innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>';
prevBtn.style.cssText='position:absolute;left:12px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;color:#fff';
prevBtn.onclick=function(ev){ev.stopPropagation();curIdx=(curIdx-1+allImgs.length)%allImgs.length;img.src=allImgs[curIdx];counter.textContent=(curIdx+1)+'/'+allImgs.length;img.zoomLevel=1;img.rotation=0;img.style.transform='scale(1) rotate(0deg)';if(range)range.value=100;if(pct)pct.textContent='100%'};
lb.appendChild(prevBtn);
var nextBtn=document.createElement('button');nextBtn.innerHTML='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>';
nextBtn.style.cssText='position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);border:none;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;color:#fff';
nextBtn.onclick=function(ev){ev.stopPropagation();curIdx=(curIdx+1)%allImgs.length;img.src=allImgs[curIdx];counter.textContent=(curIdx+1)+'/'+allImgs.length;img.zoomLevel=1;img.rotation=0;img.style.transform='scale(1) rotate(0deg)';if(range)range.value=100;if(pct)pct.textContent='100%'};
lb.appendChild(nextBtn);
}

// Bottom toolbar
var bb=document.createElement('div');bb.style.cssText='position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.4);padding:6px 16px;border-radius:24px;z-index:2';
var zOut=document.createElement('button');zOut.textContent='−';zOut.style.cssText='background:none;border:none;color:#fff;font-size:18px;cursor:pointer;width:28px;text-align:center;padding:0;line-height:1';
zOut.onclick=function(ev){ev.stopPropagation();img.zoomLevel=Math.max(.5,img.zoomLevel-.25);img.style.transform='scale('+img.zoomLevel+') rotate('+img.rotation+'deg)';range.value=img.zoomLevel*100;pct.textContent=Math.round(img.zoomLevel*100)+'%'};
bb.appendChild(zOut);
var range=document.createElement('input');range.type='range';range.min='50';range.max='300';range.value='100';range.style.cssText='width:80px;cursor:pointer;accent-color:#fff';
var pct=document.createElement('span');pct.textContent='100%';pct.style.cssText='color:#fff;font-size:12px;min-width:36px;text-align:center;font-variant-numeric:tabular-nums';
range.oninput=function(ev){ev.stopPropagation();img.zoomLevel=this.value/100;img.style.transform='scale('+img.zoomLevel+') rotate('+img.rotation+'deg)';pct.textContent=Math.round(img.zoomLevel*100)+'%'};
bb.appendChild(range);bb.appendChild(pct);
var zIn=document.createElement('button');zIn.textContent='+';zIn.style.cssText='background:none;border:none;color:#fff;font-size:18px;cursor:pointer;width:28px;text-align:center;padding:0;line-height:1';
zIn.onclick=function(ev){ev.stopPropagation();img.zoomLevel=Math.min(3,img.zoomLevel+.25);img.style.transform='scale('+img.zoomLevel+') rotate('+img.rotation+'deg)';range.value=img.zoomLevel*100;pct.textContent=Math.round(img.zoomLevel*100)+'%'};
bb.appendChild(zIn);
var sep=document.createElement('span');sep.style.cssText='width:1px;height:16px;background:rgba(255,255,255,.2)';bb.appendChild(sep);
var resetBtn=document.createElement('button');resetBtn.textContent='1:1';resetBtn.style.cssText='background:none;border:none;color:#fff;font-size:11px;cursor:pointer;padding:2px 8px;border-radius:4px;font-weight:600';
resetBtn.onclick=function(ev){ev.stopPropagation();img.zoomLevel=1;img.rotation=0;img.style.transform='scale(1) rotate(0deg)';range.value=100;pct.textContent='100%'};
bb.appendChild(resetBtn);
var rotBtn=document.createElement('button');rotBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>';
rotBtn.style.cssText='background:none;border:none;cursor:pointer;padding:4px;display:flex;align-items:center';
rotBtn.onclick=function(ev){ev.stopPropagation();img.rotation=(img.rotation+90)%360;img.style.transform='scale('+img.zoomLevel+') rotate('+img.rotation+'deg)'};
bb.appendChild(rotBtn);
lb.appendChild(bb);

// Wheel zoom
lb.addEventListener('wheel',function(ev){ev.preventDefault();ev.stopPropagation();img.zoomLevel=Math.max(.5,Math.min(3,img.zoomLevel-ev.deltaY/500));img.style.transform='scale('+img.zoomLevel+') rotate('+img.rotation+'deg)';range.value=img.zoomLevel*100;pct.textContent=Math.round(img.zoomLevel*100)+'%'});

// Keyboard nav
lb.addEventListener('keydown',function(ev){if(allImgs.length>1&&ev.key==='ArrowLeft'){prevBtn.click()}else if(allImgs.length>1&&ev.key==='ArrowRight'){nextBtn.click()}else if(ev.key==='Escape'){lb.remove()}});
lb.tabIndex=0;lb.focus();
document.body.appendChild(lb)}
function goSlide(n){const t=cur?.images?.length||1;cs=Math.max(0,Math.min(n,t-1));upCar()}
function goNext(){goSlide(cs+1)}function goPrev(){goSlide(cs-1)}
</script>
</body>
</html>
